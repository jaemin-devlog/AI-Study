<svg xmlns="http://www.w3.org/2000/svg" width="880" height="354" viewBox="0 0 880 354" role="img" aria-labelledby="title desc">
<title id="title">Branch</title>
<desc id="desc">A leads to B. At B, the history splits: main points to C, while docs/git-note points to E after D. Arrows run from older commits to newer commits.</desc>
<defs><marker id="arrow-common" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker><marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker><marker id="arrow-topic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker></defs>
<style>
text { font-family: "Segoe UI", Arial, sans-serif; }
.title { font-size: 23px; font-weight: 700; fill: #0f172a; }
.subtitle { font-size: 15px; fill: #475569; }
.panel-label { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 1.3px; }
.commit { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.badge { font-size: 14px; font-weight: 600; text-anchor: middle; }
</style>
<rect width="880" height="354" rx="18" fill="#ffffff"/>
<text x="30" y="40" class="title">Branch</text>
<rect x="24" y="80" width="832" height="246" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><path data-edge="A-B" d="M 146.00 160.00 L 249.00 160.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="B-C" d="M 306.00 160.00 L 449.00 160.00" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-main)"/><path data-edge="B-D" d="M 302.78 172.53 L 452.84 255.06" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><path data-edge="D-E" d="M 506.00 270.00 L 659.00 270.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><g data-node="A"><circle cx="120" cy="160" r="23" fill="#64748b"/><text x="120" y="166" class="commit">A</text></g><g data-node="B"><circle cx="280" cy="160" r="23" fill="#64748b"/><text x="280" y="166" class="commit">B</text></g><g data-node="C"><circle cx="480" cy="160" r="23" fill="#2563eb"/><text x="480" y="166" class="commit">C</text></g><g data-node="D"><circle cx="480" cy="270" r="23" fill="#7c3aed"/><text x="480" y="276" class="commit">D</text></g><g data-node="E"><circle cx="690" cy="270" r="23" fill="#7c3aed"/><text x="690" y="276" class="commit">E</text></g><g><rect x="446" y="105" width="68" height="29" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="480" y="124" class="badge" fill="#2563eb">main</text></g><g><rect x="619" y="215" width="142" height="29" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="690" y="234" class="badge" fill="#7c3aed">docs/git-note</text></g>
</svg>
