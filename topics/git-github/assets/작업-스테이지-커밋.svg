<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">작업 폴더에서 커밋까지</title><desc id="desc">파일 저장 후 add는 현재 파일 상태를 스테이지에 올리고 commit은 스테이지를 저장소에 기록한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker></defs>
<rect width="1200" height="300" fill="white"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" text-anchor="middle" fill="#14263b">
<rect x="30" y="65" width="280" height="145" rx="16" fill="#e9f2ff" stroke="#497fb4" stroke-width="3"/><text x="170" y="112" font-size="25" font-weight="bold">작업 폴더</text><text x="170" y="150" font-size="19">실제 파일을 수정하고 저장</text><text x="170" y="180" font-size="18">미등록 변경</text>
<rect x="460" y="65" width="280" height="145" rx="16" fill="#e8f7ec" stroke="#49966b" stroke-width="3"/><text x="600" y="112" font-size="25" font-weight="bold">스테이지</text><text x="600" y="150" font-size="19">다음 커밋에 넣을 상태</text><text x="600" y="180" font-size="18">add 시점의 파일 내용</text>
<rect x="890" y="65" width="280" height="145" rx="16" fill="#fff1de" stroke="#c9873b" stroke-width="3"/><text x="1030" y="112" font-size="25" font-weight="bold">로컬 저장소</text><text x="1030" y="150" font-size="19">커밋으로 남긴 이력</text><text x="1030" y="180" font-size="18">이전 커밋도 유지</text>
<path d="M 320 138 H 445" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><path d="M 750 138 H 875" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/><text x="383" y="120" font-size="20">git add</text><text x="814" y="120" font-size="20">git commit</text><text x="600" y="258" font-size="19">add 후 파일을 다시 수정하면 새 수정은 작업 폴더에만 남음</text></g></svg>