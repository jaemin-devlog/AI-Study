<svg xmlns="http://www.w3.org/2000/svg" width="880" height="466" viewBox="0 0 880 466" role="img" aria-labelledby="title desc">
<title id="title">Fast-forward merge</title>
<desc id="desc">Before: A, B, C and D form one line. main points to B and docs/git-note points to D. After: the same four commits remain, and both branch names point to D. No new commit is created. Arrows run from older commits to newer commits.</desc>
<defs><marker id="arrow-common" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker><marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker><marker id="arrow-topic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker></defs>
<style>
text { font-family: "Segoe UI", Arial, sans-serif; }
.title { font-size: 23px; font-weight: 700; fill: #0f172a; }
.subtitle { font-size: 15px; fill: #475569; }
.panel-label { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 1.3px; }
.commit { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.badge { font-size: 14px; font-weight: 600; text-anchor: middle; }
</style>
<rect width="880" height="466" rx="18" fill="#ffffff"/>
<text x="30" y="40" class="title">Fast-forward merge</text><text x="30" y="65" class="subtitle">No new commit</text>
<rect x="24" y="90" width="832" height="160" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="46" y="118" class="panel-label">BEFORE</text><path data-edge="A-B" d="M 151.00 180.00 L 284.00 180.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="B-C" d="M 341.00 180.00 L 474.00 180.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><path data-edge="C-D" d="M 531.00 180.00 L 679.00 180.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><g data-node="A"><circle cx="125" cy="180" r="23" fill="#64748b"/><text x="125" y="186" class="commit">A</text></g><g data-node="B"><circle cx="315" cy="180" r="23" fill="#2563eb"/><text x="315" y="186" class="commit">B</text></g><g data-node="C"><circle cx="505" cy="180" r="23" fill="#7c3aed"/><text x="505" y="186" class="commit">C</text></g><g data-node="D"><circle cx="710" cy="180" r="23" fill="#7c3aed"/><text x="710" y="186" class="commit">D</text></g><g><rect x="281" y="125" width="68" height="29" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="315" y="144" class="badge" fill="#2563eb">main</text></g><g><rect x="639" y="125" width="142" height="29" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="710" y="144" class="badge" fill="#7c3aed">docs/git-note</text></g><rect x="24" y="282" width="832" height="156" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="46" y="310" class="panel-label">AFTER</text><path data-edge="A-B" d="M 151.00 375.00 L 284.00 375.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="B-C" d="M 341.00 375.00 L 474.00 375.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="C-D" d="M 531.00 375.00 L 679.00 375.00" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-main)"/><g data-node="A"><circle cx="125" cy="375" r="23" fill="#64748b"/><text x="125" y="381" class="commit">A</text></g><g data-node="B"><circle cx="315" cy="375" r="23" fill="#64748b"/><text x="315" y="381" class="commit">B</text></g><g data-node="C"><circle cx="505" cy="375" r="23" fill="#64748b"/><text x="505" y="381" class="commit">C</text></g><g data-node="D"><circle cx="710" cy="375" r="23" fill="#2563eb"/><text x="710" y="381" class="commit">D</text></g><path d="M 635 335 L 710 350" stroke="#2563eb" stroke-width="1.6" fill="none"/><path d="M 748 335 L 710 350" stroke="#7c3aed" stroke-width="1.6" fill="none"/><g><rect x="601" y="306" width="68" height="29" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="635" y="325" class="badge" fill="#2563eb">main</text></g><g><rect x="677" y="306" width="142" height="29" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="748" y="325" class="badge" fill="#7c3aed">docs/git-note</text></g>
</svg>
