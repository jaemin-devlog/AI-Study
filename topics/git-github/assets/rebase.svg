<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
<title id="title">Rebase</title>
<desc id="desc">Before: main points to C after A and B, and docs/git-note points to E after branching from B through D. After: D and E are replayed as new commits D-prime and E-prime after C. docs/git-note points to E-prime. main still points to C. Arrows run from older commits to newer commits.</desc>
<defs><marker id="arrow-common" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/></marker><marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/></marker><marker id="arrow-topic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/></marker></defs>
<style>
text { font-family: "Segoe UI", Arial, sans-serif; }
.title { font-size: 23px; font-weight: 700; fill: #0f172a; }
.subtitle { font-size: 15px; fill: #475569; }
.panel-label { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 1.3px; }
.commit { font-size: 18px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.badge { font-size: 14px; font-weight: 600; text-anchor: middle; }
</style>
<rect width="880" height="560" rx="18" fill="#ffffff"/>
<text x="30" y="40" class="title">Rebase</text><text x="30" y="65" class="subtitle">main stays at C</text>
<rect x="24" y="90" width="832" height="240" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="46" y="118" class="panel-label">BEFORE</text><path data-edge="A-B" d="M 141.00 170.00 L 249.00 170.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="B-C" d="M 306.00 170.00 L 439.00 170.00" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-main)"/><path data-edge="B-D" d="M 303.01 182.11 L 442.57 255.56" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><path data-edge="D-E" d="M 496.00 270.00 L 659.00 270.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><g data-node="A"><circle cx="115" cy="170" r="23" fill="#64748b"/><text x="115" y="176" class="commit">A</text></g><g data-node="B"><circle cx="280" cy="170" r="23" fill="#64748b"/><text x="280" y="176" class="commit">B</text></g><g data-node="C"><circle cx="470" cy="170" r="23" fill="#2563eb"/><text x="470" y="176" class="commit">C</text></g><g data-node="D"><circle cx="470" cy="270" r="23" fill="#7c3aed"/><text x="470" y="276" class="commit">D</text></g><g data-node="E"><circle cx="690" cy="270" r="23" fill="#7c3aed"/><text x="690" y="276" class="commit">E</text></g><g><rect x="436" y="115" width="68" height="29" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="470" y="134" class="badge" fill="#2563eb">main</text></g><g><rect x="619" y="215" width="142" height="29" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="690" y="234" class="badge" fill="#7c3aed">docs/git-note</text></g><rect x="24" y="352" width="832" height="178" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="46" y="380" class="panel-label">AFTER</text><path data-edge="A-B" d="M 136.00 470.00 L 239.00 470.00" fill="none" stroke="#64748b" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-common)"/><path data-edge="B-C" d="M 296.00 470.00 L 399.00 470.00" fill="none" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-main)"/><path data-edge="C-D" d="M 456.00 470.00 L 559.00 470.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><path data-edge="D-E" d="M 616.00 470.00 L 719.00 470.00" fill="none" stroke="#7c3aed" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-topic)"/><g data-node="A"><circle cx="110" cy="470" r="23" fill="#64748b"/><text x="110" y="476" class="commit">A</text></g><g data-node="B"><circle cx="270" cy="470" r="23" fill="#64748b"/><text x="270" y="476" class="commit">B</text></g><g data-node="C"><circle cx="430" cy="470" r="23" fill="#2563eb"/><text x="430" y="476" class="commit">C</text></g><g data-node="D"><circle cx="590" cy="470" r="23" fill="#7c3aed"/><text x="590" y="476" class="commit">D&#x27;</text></g><g data-node="E"><circle cx="750" cy="470" r="23" fill="#7c3aed"/><text x="750" y="476" class="commit">E&#x27;</text></g><g><rect x="396" y="415" width="68" height="29" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="430" y="434" class="badge" fill="#2563eb">main</text></g><g><rect x="679" y="415" width="142" height="29" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="750" y="434" class="badge" fill="#7c3aed">docs/git-note</text></g>
</svg>
